[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "real2sim-platform"
version = "0.1.0"
description = "Real2Sim scene, collection, training, and inference management platform"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "huggingface_hub>=0.24",
  "imageio>=2.34",
  "opencv-python-headless>=4.9",
  "pillow>=10",
  "pyarrow>=15",
  "mujoco>=3.2",
  "pydantic>=2",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.27",
]

[project.scripts]
real2sim-platform = "real2sim_platform.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"real2sim_platform" = [
  "static/*",
  "static/vendor/*",
  "static/vendor/three/*",
  "static/vendor/three/addons/controls/*",
  "static/vendor/three/addons/loaders/*",
  "static/vendor/three/addons/postprocessing/*",
  "static/vendor/three/addons/utils/*",
]
